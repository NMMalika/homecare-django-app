{% extends "staff/base.html" %}

{% block title %}Delete FAQ | Hands-On Health{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow-sm rounded-4 mx-auto" style="max-width: 650px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-danger fs-1 mb-3">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>

            <h2 class="fw-bold">Delete this FAQ?</h2>
            <p class="text-muted">
                This will permanently delete the question and answer below.
            </p>

            <div class="p-3 bg-light rounded-3 my-4">
                <h5>{{ faq.question }}</h5>
                <p class="mb-0">{{ faq.answer|truncatechars:250 }}</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="fa-solid fa-trash me-2"></i>Yes, delete FAQ
                </button>
                <a href="{% url 'staff:faq_list' %}" class="btn btn-outline-secondary ms-2">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
